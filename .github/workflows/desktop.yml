name: desktop-builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pywin32

      - name: Build Windows zip
        run: python build_desktop.py --dist dist --work build --zip --no-desktop-copy

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.arch == 'x86_64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt pyinstaller

      - name: Build Mac zip
        run: python3 build_desktop.py --dist dist --work build --zip

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip

  release:
    needs: [windows, macos]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            下載桌面版：

            - Windows：`VictorPDFToolsBox-windows-x64.zip`
            - Mac（Apple 晶片）：`VictorPDFToolsBox-macos-arm64.zip`
            - Mac（Intel，如有提供）：`VictorPDFToolsBox-macos-x86_64.zip`

            Mac 第一次開啟若提示無法驗證開發者，請在 Finder 對 App 按右鍵 → 打開。
          files: artifacts/**/*.zip
